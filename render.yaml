services:
  - type: web
    name: spend-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker con hilos: el plan free tiene 512 MB y cada worker carga todo el
    # stack (LangGraph, SQLAlchemy, pool de Postgres). El timeout largo es porque
    # un turno del agente con herramientas puede tardar más de los 30s por defecto.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /manifest.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: COACH_ENV
        value: production
      - key: COACH_HTTPS
        value: "1"
      - key: COACH_ENGINE
        value: langgraph
      - key: COACH_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
