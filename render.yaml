# Blueprint de Render: crea el servicio web con un clic ("New +" → "Blueprint").
# La base de datos vive en Neon (Postgres gratis): pega su URL en DATABASE_URL.
services:
  - type: web
    name: spend-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /manifest.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: COACH_ENV
        value: production
      - key: COACH_HTTPS
        value: "1"
      - key: COACH_SECRET_KEY
        generateValue: true          # Render genera una clave fuerte automáticamente
      - key: ANTHROPIC_API_KEY
        sync: false                  # se pega a mano en el dashboard de Render (secreto)
      - key: DATABASE_URL
        sync: false                  # URL de Neon (postgresql://...)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
